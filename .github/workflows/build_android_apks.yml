name: CI-BuildAndroidApks

on:
  push:
    branches:
      - master

env:
  RELEASE_TAG: latest-master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-mode: [debug, profile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (${{ matrix.build-mode }})
        run: flutter build apk --${{ matrix.build-mode }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idle_game-${{ matrix.build-mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.build-mode }}.apk
          if-no-files-found: error
          # The rolling prerelease is the durable copy; these are only job-to-job transport.
          retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs: build-apk

    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Unsigned development builds of \`master\` (commit \`${GITHUB_SHA::7}\`).

          | Build | Download |
          |---|---|
          | Debug | [app-debug.apk](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/app-debug.apk) |
          | Profile | [app-profile.apk](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/app-profile.apk) |

          These links always point at the newest \`master\` build.

          Android blocks installs from unknown sources by default; allow it for your
          browser or file manager before installing.
          EOF

      - name: Publish APKs to rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recreate the release so the tag follows the newest master commit and no
          # stale assets linger. The download URLs stay stable across runs.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build (master)" \
            --notes-file notes.md \
            apks/app-debug.apk \
            apks/app-profile.apk
